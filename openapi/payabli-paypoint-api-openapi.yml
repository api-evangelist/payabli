          $ref: '#/components/schemas/Responsecode'
        responseData:
          $ref: '#/components/schemas/PaypointEntryConfig'
        responseText:
          $ref: '#/components/schemas/ResponseText'
      required:
      - isSuccess
      - responseText
      title: GetEntryConfigResponse
    AchSetup:
      type: object
      properties:
        acceptCCD:
          type: boolean
          description: 'CCD is an ACH SEC Code that can be used in ACH transactions by the

            user that indicates the transaction is a Corporate Credit or Debit

            Entry.

            '
        acceptPPD:
          type: boolean
          description: 'PPD is an ACH SEC Code that can be used in ACH transactions by the

            user that indicates the transaction is a Prearranged Payment and

            Deposit.

            '
        acceptWeb:
          type: boolean
          description: 'Web is an ACH SEC Code that can be used in ACH transactions by the

            user that indicates the transaction is an Internet-Initiated/Mobile

            Entry.

            '
      description: 'Configuration for which ACH SEC codes the user is allowed to use.

        '
      title: AchSetup
