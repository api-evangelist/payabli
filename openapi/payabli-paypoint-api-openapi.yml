        untilCancelled:
          type: boolean
          description: Flag to enable the 'untilCancelled' option.
      title: Finishtype
    AddressAddtlNullable:
      type: string
      description: Additional line for the address.
      title: AddressAddtlNullable
    MethodElementSettingsApplePay:
      type: object
      properties:
        buttonStyle:
