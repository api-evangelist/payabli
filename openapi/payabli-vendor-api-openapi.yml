    VendorScheduleCallRequest:
      type: object
      properties:
        vendorId:
          type: integer
          format: int64
          description: ID of the vendor to call. Must be active and belong to the entrypoint in the path.
        phone:
          type: string
          description: Vendor phone number to call, digits only. Optional. When omitted, Payabli uses the phone number on the vendor's record. If the vendor has no phone on record, the request returns an error.
        enrichmentId:
          type: string
          description: ID of the originating enrichment run to associate with this call. Optional. When omitted, Payabli generates a standalone call schedule and skips the enrichment lookup. The bill due-date check only runs when both `enrichmentId` and `billId` are supplied.
        billId:
          type: integer
          format: int64
          description: Bill ID used for the due-date check. When the bill is due in fewer than three days, the call is skipped and the fallback method is applied. Only evaluated when `enrichmentId` is also supplied.
        fallbackMethod:
          type: string
          description: Payment method to apply to the vendor record if the call can't determine a preference or all retries are exhausted. Values are `check` (the default) or `managed`.
        maxRetries:
          type: integer
          description: Number of times to retry the call if the vendor doesn't answer. Defaults to 3. Maximum is 5. The get outreach call status response reports this value as `maxAttempts`.
        timezone:
          type: string
          description: IANA timezone identifier used to schedule the call in the vendor's local time. Defaults to `America/New_York`.
        sendNow:
          type: boolean
          description: When `true`, dispatches the call immediately and bypasses the business-hours window and the bill due-date check. Defaults to `false`.
      required:
      - vendorId
      description: Request body for scheduling an AI outreach call to a vendor.
      title: VendorScheduleCallRequest
