components:
  schemas:
    PayoutTransactionReleasedContent:
      type: object
      properties:
        Event:
          type: string
          enum:
          - PayOutReleased
          description: Event type identifier
        Paypoint:
          type: string
          description: The name of the merchant/paypoint
        Text:
          type: string
          description: Human-readable description of the event
        TransId:
          type: string
          description: Unique transaction identifier
        TotalAmount:
          type: string
          description: Total transaction amount including fees
        CustomerId:
          type: string
          description: The unique identifier for the customer
        CustomerNumber:
          type: string
          description: Internal customer identifier
        Method:
          type: string
          description: Payment processing method
        ExternalPaypointId:
          type:
          - string
          - 'null'
          description: External paypoint system identifier
        TraceNumber:
          type:
          - string
          - 'null'
          description: Trace number for the vendor ACH credit
        entryPoint:
          type: string
          description: System entry point identifier
        RefundAmount:
          type: string
          description: Leftover amount not accepted by the vendor when a payout is partially accepted
      required:
      - Event
      - Paypoint
      - Text
      - TransId
      - TotalAmount
      - CustomerId
      - CustomerNumber
      - Method
      - ExternalPaypointId
      - TraceNumber
      - entryPoint
      - RefundAmount
      title: PayoutTransactionReleasedContent
    PayoutTransactionErrorContent:
      type: object
      properties:
        Event:
          type: string
          enum:
          - PayOutError
          description: Event type identifier
        Paypoint:
          type: string
          description: The name of the merchant/paypoint
        Text:
          type: string
          description: Human-readable description of the event
        TransId:
          type: string
          description: Unique transaction identifier
        TotalAmount:
          type: string
          description: Total transaction amount including fees
        CustomerId:
          type: string
          description: The unique identifier for the customer
        CustomerNumber:
          type: string
          description: Internal customer identifier
        Method:
          type: string
          description: Payment processing method
        ExternalPaypointId:
          type:
          - string
          - 'null'
          description: External paypoint system identifier
        entryPoint:
          type: string
          description: System entry point identifier
        RefundAmount:
          type: string
          description: Leftover amount not accepted by the vendor when a payout is partially accepted
        FundingSource:
          type: string
          description: The funding source used to fund the payout.
        PaymentStatus:
          type: string
          description: The resulting payment status for the transaction after the capture attempt.
        Reason:
          type: string
          description: The reason the payout capture didn't succeed.
      required:
      - Event
      - Paypoint
      - Text
      - TransId
      - TotalAmount
      - CustomerId
      - CustomerNumber
      - Method
      - ExternalPaypointId
      - entryPoint
      - RefundAmount
      - FundingSource
      - PaymentStatus
      - Reason
