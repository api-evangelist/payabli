      description: The notification's event name.
      title: NotificationStandardRequestContentEventType
    NotificationContentEventType:
      type: string
      enum:
      - ApprovedPayment
      - AuthorizedPayment
      - DeclinedPayment
      - OriginatedPayment
      - SettledPayment
      - SubscriptionCreated
      - SubscriptionUpdated
      - SubscriptionCanceled
      - SubscriptionCompleted
