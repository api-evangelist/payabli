      - VoidedPayment
      - RefundedPayment
      - HoldTransaction
      - ReleasedTransaction
      - HoldBatch
      - ReleasedBatch
      - TransferDisabledCreditFund
      - TransferDisabledDebitFund
      - TransferNotAvailableBalance
      - TransferReturn
      - TransferSuccess
      - TransferSuspended
      - TransferError
      - SendReceipt
      - RecoveredTransaction
      - CardUpdaterComplete
      - CreatedApplication
      - ApprovedApplication
      - FailedBoardingApplication
      - SubmittedApplication
      - ActivatedMerchant
      - ReceivedChargeBack
      - ChargebackUpdated
      - ReceivedRetrieval
      - RetrievalUpdated
      - ReceivedAchReturn
      - HoldingApplication
      - DeclinedApplication
      - BoardingApplication
      - FraudAlert
      - InvoiceSent
