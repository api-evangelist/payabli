openapi: 3.1.0
info:
  title: API reference Bill Notification API
  version: 1.0.0
servers:
- url: https://api-sandbox.payabli.com/api
  description: Sandbox
- url: https://api.payabli.com/api
  description: Production
tags:
- name: Notification
paths:
  /Notification:
    post:
      operationId: AddNotification
      summary: Add notification
      description: Create a new notification or auto-generated report.
      tags:
      - Notification
      parameters:
      - name: Authorization
        in: header
        description: 'OAuth2 Bearer access token from the client-credentials flow. See [OAuth authentication](/developers/oauth-authentication).

          '
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliApiResponseNotifications'
        '400':
          description: Bad request / invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '401':
          description: Unauthorized request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '503':
          description: Database connection error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNotificationRequest'
  /Notification/{nId}:
    get:
      operationId: GetNotification
      summary: Get notification
      description: Retrieves a single notification or auto-generated report's details.
      tags:
      - Notification
      parameters:
      - name: nId
        in: path
        description: Notification ID.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'OAuth2 Bearer access token from the client-credentials flow. See [OAuth authentication](/developers/oauth-authentication).

          '
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQueryRecord'
        '400':
          description: Bad request / invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '401':
          description: Unauthorized request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '503':
          description: Database connection error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
    put:
      operationId: UpdateNotification
      summary: Update notification
      description: Update a notification or auto-generated report.
      tags:
      - Notification
      parameters:
      - name: nId
        in: path
        description: Notification ID.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'OAuth2 Bearer access token from the client-credentials flow. See [OAuth authentication](/developers/oauth-authentication).

          '
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliApiResponseNotifications'
        '400':
          description: Bad request / invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '401':
          description: Unauthorized request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '503':
          description: Database connection error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRequest'
    delete:
      operationId: DeleteNotification
      summary: Delete notification
      description: Deletes a single notification or auto-generated report.
      tags:
      - Notification
      parameters:
      - name: nId
        in: path
        description: Notification ID.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 'OAuth2 Bearer access token from the client-credentials flow. See [OAuth authentication](/developers/oauth-authentication).

          '
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliApiResponseNotifications'
        '400':
          description: Bad request / invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '401':
          description: Unauthorized request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
        '503':
          description: Database connection error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayabliErrorBody'
  /Export/notificationReport/{Id}:
    get:
      operationId: GetReportFile
      summary: Export generated report by ID
      description: Gets a copy of a generated report by ID.
      tags:
      - Notification
      parameters:
      - name: Id
        in: path
        description: Report ID
        required: true
        schema:
          type: integer
          format: int64
      - name: Authorization
        in: header
        description: 'OAuth2 Bearer access token from the client-credentials flow. See [OAuth authentication](/developers/oauth-authentication).

          '
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
components:
  schemas:
    NotificationReportRequestFrequency:
      type: string
      enum:
      - one-time
      - daily
      - weekly
      - biweekly
      - monthly
      - quarterly
      - semiannually
      - annually
      title: NotificationReportRequestFrequency
    PayabliApiResponseNotifications:
      type: object
      properties:
        isSuccess:
          $ref: '#/components/schemas/IsSuccess'
          description: 'If `isSuccess` = true, `responseData` contains the notification identifier.

            If `isSuccess` = false, `responseData` contains the reason for the error.'
        pageIdentifier:
          $ref: '#/components/schemas/PageIdentifier'
        responseCode:
          $ref: '#/components/schemas/Responsecode'
        responseData:
          $ref: '#/components/schemas/PayabliApiResponseNotificationsResponseData'
          description: When the request was successful, this contains the notification ID, or `nID` used to manage the notification.
        responseText:
          $ref: '#/components/schemas/ResponseText'
      required:
      - responseText
      title: PayabliApiResponseNotifications
    File:
      type: object
      additionalProperties:
        description: Any type
      description: A file containing the response data, in the format specified in the request.
      title: File
    PayabliApiResponseNotificationsResponseData:
      oneOf:
      - type: integer
      - type: string
      description: 'When the request was successful, this contains the notification ID, or

        `nID` used to manage the notification.

        '
      title: PayabliApiResponseNotificationsResponseData
    Frequencynotification:
      type: string
      enum:
      - one-time
      - daily
      - weekly
      - biweekly
      - monthly
      - quarterly
      - semiannually
      - annually
      - untilcancelled
      description: Frequency for notifications.
      title: Frequencynotification
    NotificationContentReportName:
      type: string
      enum:
      - Transaction
      - Settlement
      - Boarding
      - Returned
      description: 'The kind of report to generate. For

        [automated reports](/developers/developer-guides/notifications-and-webhooks-overview#automated-reports)

        only.

        '
      title: NotificationContentReportName
    NotificationStandardRequestContentEventType:
      type: string
