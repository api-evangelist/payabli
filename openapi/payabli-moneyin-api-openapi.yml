  /MoneyIn/refund/{transId}/{amount}:
    get:
      operationId: Refund
      summary: Refund a settled transaction
      description: "<Warning>\n  This endpoint is deprecated. Use it only to refund transactions originally created with the legacy endpoints. New integrations should use the [Refund endpoint](/developers/api-reference/moneyinV2/refund-a-settled-transaction), which only works on transactions created with [Make a transaction](/developers/api-reference/moneyinV2/make-a-transaction) or [Authorize](/developers/api-reference/moneyinV2/authorize-a-transaction).\n</Warning>\n\nRefund a transaction that has settled and send money back to the account holder. If a transaction hasn't been settled, void it instead.\n"
      tags:
      - moneyIn
      parameters:
      - name: amount
        in: path
        description: 'Amount to refund from original transaction, minus any service fees charged on the original transaction.


          The amount provided can''t be greater than the original total amount of the transaction, minus service fees. For example, if a transaction was \$90 plus a \$10 service fee, you can refund up to \$90.


          An amount equal to zero will refund the total amount authorized minus any service fee.'
        required: true
        schema:
          type: number
          format: double
      - name: transId
        in: path
        description: ReferenceId for the transaction (PaymentId).
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
