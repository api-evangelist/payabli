  /MoneyIn/refund/{transId}:
    post:
      operationId: RefundWithInstructions
      summary: Refund a settled transaction with split instructions
      description: "<Warning>\n  This endpoint is deprecated. Use it only to refund transactions originally created with the legacy endpoints. To refund a split-funded transaction created with [Make a transaction](/developers/api-reference/moneyinV2/make-a-transaction) or [Authorize](/developers/api-reference/moneyinV2/authorize-a-transaction), use the [Refund endpoint](/developers/api-reference/moneyinV2/refund-a-settled-transaction) with split instructions in the request body.\n</Warning>\n\nRefunds a settled transaction with split instructions.\n"
