              $ref: '#/components/schemas/RequestRefund'
  /MoneyIn/reverse/{transId}/{amount}:
    get:
      operationId: Reverse
      summary: Reverse a transaction
      description: "<Warning>\n  This endpoint is deprecated and only works on transactions created with the legacy endpoints. There's no equivalent in the current endpoints. For transactions created with [Make a transaction](/developers/api-reference/moneyinV2/make-a-transaction) or [Authorize](/developers/api-reference/moneyinV2/authorize-a-transaction), check the transaction's settlement status and call [Void](/developers/api-reference/moneyinV2/void-a-transaction) or [Refund](/developers/api-reference/moneyinV2/refund-a-settled-transaction) based on the result.\n</Warning>\n\nA reversal either refunds or voids a transaction independent of the transaction's settlement status. Send a reversal request for a transaction, and Payabli automatically determines whether it's a refund or void. You don't need to know whether the transaction is settled or not. This endpoint only works on transactions made with the legacy endpoints. For transactions made with the current endpoints, check the transaction's settlement status and call void or refund based on the result.\n"
      tags:
      - moneyIn
      parameters:
      - name: amount
        in: path
        description: 'Amount to reverse from original transaction, minus any service fees charged on the original transaction.


          The amount provided can''t be greater than the original total amount of the transaction, minus service fees. For example, if a transaction was $90 plus a $10 service fee, you can reverse up to $90.


          An amount equal to zero will refunds the total amount authorized minus any service fee.'
        required: true
        schema:
          type: number
          format: double
      - name: transId
