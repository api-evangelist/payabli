          description: ACH returns deducted from the batch.
        adjustments:
          type:
          - number
          - 'null'
          format: double
          description: Corrections applied to Billing & Fees charges.
        billingFees:
          type:
          - number
          - 'null'
          format: double
          description: Charges applied for transactions and services.
